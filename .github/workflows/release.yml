name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test daemon
        run: dotnet test --project tests/RigForge.UnitTests

      - name: Test UI
        working-directory: ui
        run: npm ci && npm test

      - name: Test shell
        working-directory: shell
        run: npm ci && npm test

      - name: Build Windows release
        run: ./deploy/Build-Release.ps1 -SkipLinux

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            artifacts/RigForge-Setup-*-win-x64.exe
            artifacts/rigforge-win-x64-*.zip

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test daemon
        run: dotnet test --project tests/RigForge.UnitTests

      - name: Build Linux release
        run: |
          chmod +x ./deploy/build-release.sh ./deploy/linux/*.sh ./deploy/linux/rigforge-open
          SKIP_WIN=1 ./deploy/build-release.sh

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: artifacts/rigforge-linux-x64-*.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Checksums
        run: |
          mkdir -p dist
          find release-files -type f -exec cp -t dist {} +
          cd dist
          sha256sum -- * > SHA256SUMS.txt

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
